name: Docker Build

on:
  push:
    branches:
      - master
      - docker
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/idawnlight/telegram-bot-api

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      json: ${{ steps.meta.outputs.json }}
      docker_sha: ${{ steps.version.outputs.docker_sha }}
      upstream_sha: ${{ steps.version.outputs.upstream_sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: docker

    - name: Checkout upstream repo
      uses: actions/checkout@v7
      with:
        ref: master
        path: upstream

    - name: Get upstream version
      id: version
      run: |
        docker_sha=$(git rev-parse HEAD)
        upstream_sha=$(git -C upstream rev-parse HEAD)
        telegram_bot_api_version=$(git -C upstream rev-parse --short HEAD)
        tdlib_version=$(git -C upstream rev-parse --short HEAD:td)
        version=$(grep -Po "project\(TelegramBotApi VERSION \K[\d.]+(?= LANGUAGES CXX\))" upstream/CMakeLists.txt)

        echo "docker_sha=$docker_sha" >> "$GITHUB_OUTPUT"
        echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "commit_sha=$telegram_bot_api_version-$tdlib_version" >> "$GITHUB_OUTPUT"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY_IMAGE }}
        tags: |
          type=raw,value=latest
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=${{ steps.version.outputs.commit_sha }}

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.metadata.outputs.docker_sha }}

    - name: Checkout upstream repo
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.metadata.outputs.upstream_sha }}
        path: upstream
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=${{ env.REGISTRY_IMAGE }},oci-artifact=true,push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::Unexpected image digest: $DIGEST"
          exit 1
        fi

        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.artifact }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - build
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Create multi-platform image
      env:
        METADATA_JSON: ${{ needs.metadata.outputs.json }}
      run: |
        set -euo pipefail

        jq -e '.tags | length > 0' >/dev/null <<< "$METADATA_JSON"
        mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")

        tag_args=()
        for tag in "${tags[@]}"; do
          tag_args+=(--tag "$tag")
        done

        shopt -s nullglob
        digest_files=("$RUNNER_TEMP"/digests/*)
        if (( ${#digest_files[@]} == 0 )); then
          echo "::error::No image digests were downloaded"
          exit 1
        fi

        sources=()
        for digest_file in "${digest_files[@]}"; do
          digest=${digest_file##*/}
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest: $digest"
            exit 1
          fi
          sources+=("${REGISTRY_IMAGE}@sha256:${digest}")
        done

        docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
